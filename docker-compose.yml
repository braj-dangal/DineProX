version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=dineprox
      - POSTGRES_USER=dineprox_user
      - POSTGRES_PASSWORD=dineprox_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dineprox-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dineprox_user -d dineprox"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - dineprox-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # DineProX Application
  dineprox-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:80"
      - "5001:443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=Host=postgres;Database=dineprox;Username=dineprox_user;Password=dineprox_password
      - Redis__Configuration=redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dineprox-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Database Migrator (runs once to set up database)
  db-migrator:
    build:
      context: .
      dockerfile: Dockerfile
    command: dotnet DineProX.DbMigrator.dll
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=Host=postgres;Database=dineprox;Username=dineprox_user;Password=dineprox_password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dineprox-network
    restart: "no"

volumes:
  postgres_data:
  redis_data:

networks:
  dineprox-network:
    driver: bridge 