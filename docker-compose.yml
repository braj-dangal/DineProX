version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dineprox_web
    restart: always
    ports:
      - "443:8443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=https://+:8443
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=password
      - ConnectionStrings__Default=Host=db;Port=5432;Database=dineprox;Username=postgres;Password=postgres
      - App__SelfUrl=https://72.61.151.220
      - App__ClientUrl=https://72.61.151.220
      - AuthServer__Authority=https://72.61.151.220
      - App__CorsOrigins=https://72.61.151.220
      - App__RedirectAllowedUrls=https://72.61.151.220
      - AuthServer__RequireHttpsMetadata=true
    volumes:
      - ./certs:/https
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: dineprox_db
    restart: always
    environment:
      POSTGRES_DB: dineprox
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: