version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dineprox-app
    restart: unless-stopped
    ports:
      - "2220:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=db;Port=5432;Database=dineprox;Username=postgres;Password=postgres
      App__SelfUrl: ${PUBLIC_URL:-http://72.61.151.220}
      App__ClientUrl: ${PUBLIC_URL:-http://72.61.151.220}
      App__CorsOrigins: ${PUBLIC_URL:-http://72.61.151.220}
      App__RedirectAllowedUrls: ${PUBLIC_URL:-http://72.61.151.220}
      AuthServer__Authority: ${PUBLIC_URL:-http://72.61.151.220}
      AuthServer__RequireHttpsMetadata: "false"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: dineprox-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dineprox
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dineprox"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: