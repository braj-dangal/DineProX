    name: dineprox-api
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile.prod
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:80
      - key: ConnectionStrings__Default
        value: Host=dpg-d235772dbo4c73fs91i0-a;Port=5432;Database=dineproxdb;Username=dineproxdb_user;Password=9oouJzige0ytL5woVP65oiF1SVMrWp9h
      - key: Redis__Configuration
        fromService:
          type: redis
          name: dineprox-redis
          property: connectionString

  - type: redis
    name: dineprox-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] 