version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: DineProX
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  migrator:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["dotnet", "DineProX.DbMigrator.dll"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=db;Port=5432;Database=DineProX;User ID=postgres;Password=${POSTGRES_PASSWORD};
    depends_on:
      - db
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=db;Port=5432;Database=DineProX;User ID=postgres;Password=${POSTGRES_PASSWORD};
      App__SelfUrl: ${APP_SELF_URL:-http://72.61.151.220:2222}
      App__CorsOrigins: ${APP_CORS_ORIGINS:-http://72.61.151.220:2222,http://localhost:4200}
      App__RedirectAllowedUrls: ${APP_CORS_ORIGINS:-http://72.61.151.220:2222,http://localhost:4200}
      AuthServer__Authority: ${APP_SELF_URL:-http://72.61.151.220:2222}
    ports:
      - "8080:8080"
    depends_on:
      - migrator
    restart: unless-stopped

volumes:
  pgdata:
