version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-dineprox}
      - POSTGRES_USER=${POSTGRES_USER:-dineprox_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-dineprox_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dineprox-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dineprox_user} -d ${POSTGRES_DB:-dineprox}"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - dineprox-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # DineProX Application
  dineprox-api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=Host=postgres;Database=${POSTGRES_DB:-dineprox};Username=${POSTGRES_USER:-dineprox_user};Password=${POSTGRES_PASSWORD:-dineprox_password}
      - Redis__Configuration=redis:6379
      - ASPNETCORE_URLS=http://+:80
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dineprox-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

  # Database Migrator (runs once to set up database)
  db-migrator:
    build:
      context: .
      dockerfile: Dockerfile.prod
    command: dotnet DineProX.DbMigrator.dll
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=Host=postgres;Database=${POSTGRES_DB:-dineprox};Username=${POSTGRES_USER:-dineprox_user};Password=${POSTGRES_PASSWORD:-dineprox_password}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dineprox-network
    restart: "no"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  dineprox-network:
    driver: bridge 